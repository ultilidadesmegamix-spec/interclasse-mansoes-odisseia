<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Inscrições Movimenta Odisseia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Evitar cache -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --azul: #0056b3;
            --azul-claro: #e3f1ff;
            --cinza: #f5f5f5;
            --borda: #d0d7e2;
            --vermelho: #d9534f;
            --verde: #28a745;
            --texto: #222;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            background: #f0f4fb;
            color: var(--texto);
        }

        header {
            background: linear-gradient(90deg, var(--azul) 0%, #007bff 100%);
            color: #fff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 8px 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-size: 0.9rem;
        }

        .btn-primaria {
            background: #ffffff;
            color: var(--azul);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .btn-admin {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
        }

        main {
            max-width: 1100px;
            margin: 20px auto 30px;
            padding: 0 12px 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--borda);
            padding: 18px 16px 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }

        /* ============================== */
        /* NOVA ÁREA — VER JOGOS (ALUNOS) */
        /* ============================== */

        #secVerJogos {
            display: none;
        }

        .jogo-box {
            border: 1px solid var(--borda);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f7faff;
        }

        .jogo-topo {
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--azul);
        }

        /* ============================== */
        /* ÁREA ADMIN — CADASTRAR JOGOS  */
        /* ============================== */

        .admin-jogo-item {
            background: #eef4ff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #c6d4ff;
        }

        .admin-jogo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        @media (max-width: 700px) {
            .admin-jogo-grid {
                grid-template-columns: 1fr;
            }
        }

        .admin-section-block {
            background: #f5f8ff;
            border: 1px dashed #cbd6f1;
            padding: 10px;
            border-radius: 10px;
            margin-top: 12px;
        }

    </style>
</head>
<body>

<header>
    <div>
        <h1>Inscrições Movimenta Odisseia</h1>
        <span class="subtitulo">Sistema oficial do evento</span>
    </div>
    <div class="header-right">
        <button id="btnToggleInscritos" class="btn btn-primaria">👀 Ver inscritos</button>

        <!-- 🔵 NOVO BOTÃO: VER JOGOS -->
        <button id="btnVerJogos" class="btn btn-primaria">🏆 Ver Jogos</button>

        <button id="btnAdminArea" class="btn btn-admin">🔐 Área Administrativa</button>
    </div>
</header>

<main>

    <!-- ===================================================== -->
    <!-- NOVA ÁREA: VER JOGOS (ALUNOS)                         -->
    <!-- ===================================================== -->
    <section class="card" id="secVerJogos">
        <h2>Jogos do Movimenta Odisseia</h2>
        <small>Selecione o turno para ver a tabela de jogos.</small>

        <label for="selectTurnoJogos" style="margin-top:12px; display:block;">Selecione o turno:</label>
        <select id="selectTurnoJogos" class="input">
            <option value="">Selecione...</option>
            <option value="Matutino">Matutino</option>
            <option value="Vespertino">Vespertino</option>
            <option value="Noturno">Noturno</option>
        </select>

        <div id="listaJogos" style="margin-top:14px;"></div>
    </section>

    <!-- ===================================================== -->
    <!-- TELA ORIGINAL: INSCRIÇÃO                              -->
    <!-- ===================================================== -->
    <section class="card" id="secInscricao">
        <!-- TUDO DO SEU FORMULÁRIO ORIGINAL CONTINUA AQUI —> <!-- ============================= -->
<!-- CONTINUAÇÃO DO HTML (PARTE 2) -->
<!-- ============================= -->

        <!-- O RESTO DO FORMULÁRIO DE INSCRIÇÃO AQUI… -->
    </section>

    <!-- ===================================================== -->
    <!-- ÁREA ADMINISTRATIVA — + CADASTRAR JOGOS               -->
    <!-- ===================================================== -->
    <section class="card" id="adminSection" style="display:none;">
        <h2>Área Administrativa</h2>

        <button id="btnFecharAdmin" class="btn btn-primaria" style="margin-bottom:10px;">
            ⬅ Fechar área administrativa
        </button>

        <!-- ============================= -->
        <!-- ÁREA PARA CADASTRAR JOGOS    -->
        <!-- ============================= -->
        <div class="admin-section-block">
            <h3>🏆 Criar tabela de jogos</h3>

            <label for="adminTurnoJogos">Selecione o turno:</label>
            <select id="adminTurnoJogos" style="margin-bottom:10px; width:100%;">
                <option value="">Selecione...</option>
                <option value="Matutino">Matutino</option>
                <option value="Vespertino">Vespertino</option>
                <option value="Noturno">Noturno</option>
            </select>

            <div id="adminListaJogos"></div>

            <button id="btnAddJogo" class="btn btn-primaria" style="margin-top:10px;">➕ Adicionar Jogo</button>
            <button id="btnSalvarJogos" class="btn btn-primaria" style="margin-top:10px; background:#28a745; color:#fff;">💾 Salvar jogos</button>
        </div>

        <!-- AQUI CONTINUA O RESTANTE DO PAINEL ADMIN (INSCRITOS, RELATÓRIOS...) -->
    </section>
</main>

<script>
/* ============================================================
   🔥 FIREBASE CONFIG
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAxB-FrZNQ7DE-e_YJOvNkkwAaCToH9nd8",
  authDomain: "inscricoes-movimenta.firebaseapp.com",
  projectId: "inscricoes-movimenta",
  storageBucket: "inscricoes-movimenta.firebasestorage.app",
  messagingSenderId: "383820865072",
  appId: "1:383820865072:web:c8602b5c2cbcd5884057f5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================================================
   🎯 VARIÁVEIS GLOBAIS
============================================================ */
let isAdmin = false;
let adminAberto = false;
let mostrandoInscritos = false;

let jogosCache = [];   // todos os jogos vindos do Firestore

/* ============================================================
   🏆 LISTENER — ATUALIZA A LISTA DE JOGOS EM TEMPO REAL
============================================================ */
db.collection("jogos").orderBy("dataTimestamp", "asc").onSnapshot((snap) => {
    jogosCache = [];
    snap.forEach(doc => {
        jogosCache.push({ id: doc.id, ...doc.data() });
    });
    renderizarJogosPublicos();
    renderizarJogosAdmin();
});

/* ============================================================
   🏆 BLOCOS FRONT-END — MOSTRAR JOGOS PARA ALUNOS
============================================================ */
function renderizarJogosPublicos() {
    const turnoSel = document.getElementById("selectTurnoJogos")?.value;
    const lista = document.getElementById("listaJogos");
    if (!lista) return;

    lista.innerHTML = "";

    if (!turnoSel) {
        lista.innerHTML = "<p>Selecione um turno para ver os jogos.</p>";
        return;
    }

    const jogosFiltrados = jogosCache.filter(j => j.turno === turnoSel);

    if (jogosFiltrados.length === 0) {
        lista.innerHTML = "<p>Nenhum jogo cadastrado para este turno.</p>";
        return;
    }

    jogosFiltrados.forEach((jogo, index) => {
        const div = document.createElement("div");
        div.className = "jogo-box";

        div.innerHTML = `
            <div class="jogo-topo">Jogo ${index + 1} — ${jogo.horario} — ${jogo.local} — ${jogo.data}</div>
            <div><b>${jogo.turmaA}</b> vs <b>${jogo.turmaB}</b></div>
        `;

        lista.appendChild(div);
    });
}

/* ============================================================
   🏆 ADMIN — MOSTRAR FORMULÁRIOS DOS JOGOS CADASTRADOS
============================================================ */
function renderizarJogosAdmin() {
    if (!isAdmin) return;
    const turno = document.getElementById("adminTurnoJogos").value;
    const lista = document.getElementById("adminListaJogos");

    lista.innerHTML = "";

    if (!turno) return;

    const jogosFiltrados = jogosCache.filter(j => j.turno === turno);

    jogosFiltrados.forEach(jogo => {
        const box = document.createElement("div");
        box.className = "admin-jogo-item";
        box.dataset.id = jogo.id;

        box.innerHTML = `
            <div class="admin-jogo-grid">
                <div>
                    <label>Turma A:</label>
                    <input type="text" class="jogo-turmaA" value="${jogo.turmaA}">
                </div>
                <div>
                    <label>Turma B:</label>
                    <input type="text" class="jogo-turmaB" value="${jogo.turmaB}">
                </div>
                <div>
                    <label>Horário:</label>
                    <input type="time" class="jogo-horario" value="${jogo.horario}">
                </div>
                <div>
                    <label>Data:</label>
                    <input type="date" class="jogo-data" value="${jogo.dataISO}">
                </div>
                <div>
                    <label>Local:</label>
                    <input type="text" class="jogo-local" value="${jogo.local}">
                </div>
            </div>

            <button class="btn btn-primaria btnDeleteJogo" style="margin-top:6px; background:#ff4e4e; color:white;">
                ❌ Excluir jogo
            </button>
        `;

        lista.appendChild(box);
    });
}

/* ============================================================
   🏆 ADMIN — ADICIONAR NOVO JOGO
============================================================ */
document.getElementById("btnAddJogo").addEventListener("click", () => {
    const turno = document.getElementById("adminTurnoJogos").value;
    if (!turno) {
        alert("Selecione o turno antes de criar jogos!");
        return;
    }

    const lista = document.getElementById("adminListaJogos");

    const box = document.createElement("div");
    box.className = "admin-jogo-item newJogo";

    box.innerHTML = `
        <div class="admin-jogo-grid">
            <div>
                <label>Turma A:</label>
                <input type="text" class="jogo-turmaA">
            </div>
            <div>
                <label>Turma B:</label>
                <input type="text" class="jogo-turmaB">
            </div>
            <div>
                <label>Horário:</label>
                <input type="time" class="jogo-horario">
            </div>
            <div>
                <label>Data:</label>
                <input type="date" class="jogo-data">
            </div>
            <div>
                <label>Local:</label>
                <input type="text" class="jogo-local">
            </div>
        </div>
    `;

    lista.appendChild(box);
});

/* ============================================================
   🏆 ADMIN — SALVAR JOGOS NO FIRESTORE
============================================================ */
document.getElementById("btnSalvarJogos").addEventListener("click", async () => {
    const turno = document.getElementById("adminTurnoJogos").value;
    if (!turno) {
        alert("Selecione o turno antes de salvar.");
        return;
    }

    const boxes = document.querySelectorAll("#adminListaJogos .admin-jogo-item");

    for (const box of boxes) {
        const turmaA = box.querySelector(".jogo-turmaA").value.trim();
        const turmaB = box.querySelector(".jogo-turmaB").value.trim();
        const horario = box.querySelector(".jogo-horario").value;
        const dataISO = box.querySelector(".jogo-data").value;
        const local = box.querySelector(".jogo-local").value.trim();

        if (!turmaA || !turmaB || !horario || !dataISO || !local) {
            alert("Preencha todos os campos dos jogos antes de salvar.");
            return;
        }

        const dataFormatada = new Date(dataISO).toLocaleDateString("pt-BR");

        // Se o jogo já existe → atualizar
        if (box.dataset.id) {
            await db.collection("jogos").doc(box.dataset.id).update({
                turno,
                turmaA,
                turmaB,
                horario,
                local,
                data: dataFormatada,
                dataISO,
                dataTimestamp: new Date(dataISO)
            });
        } else {
            // jogo novo → adicionar
            await db.collection("jogos").add({
                turno,
                turmaA,
                turmaB,
                horario,
                local,
                data: dataFormatada,
                dataISO,
                dataTimestamp: new Date(dataISO)
            });
        }
    }

    alert("Jogos salvos com sucesso!");
});

/* ============================================================
   🗑 ADMIN — EXCLUIR JOGO
============================================================ */
document.addEventListener("click", async (e) => {
    if (e.target.classList.contains("btnDeleteJogo")) {
        const box = e.target.closest(".admin-jogo-item");
        const id = box.dataset.id;

        if (!id) {
            box.remove();
            return;
        }

        if (!confirm("Deseja excluir este jogo?")) return;

        await db.collection("jogos").doc(id).delete();
        box.remove();
    }
});

/* ============================================================
   🔄 TROCAR DE TELAS (INSCRIÇÃO / VER JOGOS / VER INSCRITOS)
============================================================ */
document.getElementById("btnVerJogos").addEventListener("click", () => {
    document.getElementById("secInscricao").style.display = "none";
    document.getElementById("secInscritos").style.display = "none";
    document.getElementById("adminSection").style.display = "none";

    document.getElementById("secVerJogos").style.display = "block";
});

document.getElementById("selectTurnoJogos").addEventListener("change", renderizarJogosPublicos);

document.getElementById("adminTurnoJogos").addEventListener("change", () => {
    renderizarJogosAdmin();
});

document.getElementById("btnAdminArea").addEventListener("click", () => {
    const senha = prompt("Digite a senha da área administrativa:");
    if (senha === "52090949") {
        isAdmin = true;
        adminAberto = true;

        document.getElementById("secInscricao").style.display = "none";
        document.getElementById("secInscritos").style.display = "none";
        document.getElementById("secVerJogos").style.display = "none";

        document.getElementById("adminSection").style.display = "block";
        renderizarJogosAdmin();

    } else {
        alert("Senha incorreta.");
    }
});

document.getElementById("btnFecharAdmin").addEventListener("click", () => {
    adminAberto = false;
    isAdmin = false;

    document.getElementById("adminSection").style.display = "none";
    document.getElementById("secVerJogos").style.display = "none";

    document.getElementById("secInscricao").style.display = "block";
});
</script>

</body>
</html>
